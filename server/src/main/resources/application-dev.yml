spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/memorylane?stringtype=unspecified
    username: memorylane
    password: ${DB_PASSWORD:memorylane123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    show-sql: false

logging:
  level:
    com.memorylane: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
