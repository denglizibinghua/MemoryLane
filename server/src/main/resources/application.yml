server:
  port: 8080

spring:
  application:
    name: memorylane

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---- MemoryLane 自有配置 ----
  memorylane:
    embedding:
      # 语义搜索开关：默认关闭（不需要 API key），用户可在设置页自行开启。
      # 开启后需配置一个 embedding provider（openai/zhipuai/ollama）。
      enabled: ${MEMORYLANE_EMBEDDING_ENABLED:false}
    ocr:
      # Tesseract offline OCR fallback: when LLM OCR fails (timeout, no provider, etc.),
      # try Tesseract as a free offline alternative. Set to false to disable.
      fallback-enabled: ${MEMORYLANE_OCR_FALLBACK_ENABLED:true}
      tesseract:
        # Parent directory of tessdata/ folder containing traineddata files.
        # Defaults to ./tessdata (i.e. <project-root>/tessdata/tessdata/chi_sim.traineddata)
        data-path: ${MEMORYLANE_TESSERACT_DATA_PATH:./tessdata}

  ai:
    # Provider is selected via the Settings page and stored in the DB
    # (ai_settings table). The active ChatModel is rebuilt on every change, so
    # switching providers takes effect immediately — no restart needed.
    #
    # IMPORTANT: each provider's auto-configured ChatModel beans are disabled.
    # DelegatingChatModel is the single ChatModel in the context.
    # EmbeddingModel beans are disabled by default — controlled by the
    # memorylane.embedding.enabled flag above.
    openai:
      api-key: ${LLM_API_KEY:dummy}
      chat:
        enabled: false
        options:
          model: ${LLM_MODEL:gpt-4o-mini}
          temperature: 0.3
      embedding:
        enabled: ${MEMORYLANE_EMBEDDING_ENABLED:false}
      image:
        enabled: false
      audio:
        speech:
          enabled: false
        transcription:
          enabled: false

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: false
      embedding:
        enabled: ${MEMORYLANE_EMBEDDING_ENABLED:false}

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy}
      chat:
        enabled: false

    # DashScope/通义 uses Alibaba's OpenAI-compatible endpoint
    # (https://dashscope.aliyuncs.com/compatible-mode/v1) — see
    # DynamicChatModelFactory.
    # dashscope:
    #   api-key: ${DASHSCOPE_API_KEY:dummy}

    zhipuai:
      api-key: ${ZHIPUAI_API_KEY:dummy}
      chat:
        enabled: false
      embedding:
        enabled: ${MEMORYLANE_EMBEDDING_ENABLED:false}
      image:
        enabled: false

    moonshot:
      api-key: ${MOONSHOT_API_KEY:dummy}
      chat:
        enabled: false

    # ------------------------------------------------------------------
    # Supported providers and their config keys (for reference):
    #   openai:    spring.ai.openai.api-key     (api base: https://api.openai.com)
    #   ollama:    spring.ai.ollama.base-url    (default http://localhost:11434)
    #   anthropic: spring.ai.anthropic.api-key  (api base: https://api.anthropic.com)
    #   dashscope: spring.ai.openai.api-key     (OpenAI-compatible, base https://dashscope.aliyuncs.com/compatible-mode/v1)
    #   zhipuai:   spring.ai.zhipuai.api-key    (base: https://open.bigmodel.cn/api/paas)
    #   moonshot:  spring.ai.moonshot.api-key   (base: https://api.moonshot.cn)
    # ------------------------------------------------------------------

logging:
  level:
    com.memorylane: DEBUG
    org.springframework.ai: DEBUG
