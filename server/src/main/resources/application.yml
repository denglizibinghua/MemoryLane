server:
  port: 8080

spring:
  application:
    name: memorylane

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${LLM_API_KEY:your-api-key-here}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}
          temperature: 0.3

logging:
  level:
    com.memorylane: DEBUG
    org.springframework.ai: DEBUG
