version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memorylane-db
    environment:
      POSTGRES_DB: memorylane
      POSTGRES_USER: memorylane
      POSTGRES_PASSWORD: ${DB_PASSWORD:-memorylane123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorylane"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: memorylane-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/memorylane?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: memorylane
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-memorylane123}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: memorylane-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
